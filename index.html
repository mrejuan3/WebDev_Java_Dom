<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SF Airbnb Listings</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/main.css" />
  </head>

  <body>
    <div class="container">
      <header>
        <h1>SF Airbnb Listings</h1>
        <p id="welcome"></p>
        <nav>
          <ul>
            <li>Home</li>
            <li>About</li>
          </ul>
        </nav>
      </header>
      <main>
        <div class="row">
          <div class="col-lg-8 col-md-12">
            <section id="listings" class="listings row">
              <h2 class="w-100">Listings</h2>
            </section>
            <!-- .listings-->
          </div>
          <div class="col-lg-4 col-md-12">
            <h2>Create Listing</h2>
            <form action="a">
              <div class="mb-3">
                <label class="form-label">
                  <div>Title</div>
                  <input type="text" class="form-control" name="title" />
                </label>
              </div>

              <div class="mb-3">
                <label class="form-label">
                  <div>Price</div>
                  <input
                    type="number"
                    class="form-control"
                    name="Price"
                    value="120"
                  />
                </label>
              </div>

              <div class="mb-3">
                <label class="form-label">
                  <div>Description</div>
                  <input type="text" class="form-control" name="Description" />
                </label>
              </div>

              <div class="mb-3">
                <button class="btm btm-primary" type="submit">Create</button>
                <button class="btm btm-secondary">Cancel</button>
              </div>
            </form>
          </div>
        </div>
      </main>
      <footer>
        <div>&copy; 2026 SF Airbnb Listings. All rights reserved.</div>
      </footer>
    </div>
    <!-- /container -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./js/app.js"></script>
  </body>
</html>
